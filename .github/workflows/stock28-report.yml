name: A股二八原则每日报告

on:
  schedule:
    # 周一至周五，北京时间 15:30（UTC 07:30）运行
    - cron: '30 7 * * 1-5'
  workflow_dispatch:

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 安装依赖
        run: pip install requests

      - name: 运行二八统计
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
        run: cd stock28 && python3 main.py

      - name: 提交报告
        run: |
          git config --local user.email "bot@users.noreply.github.com"
          git config --local user.name "bot"
          git add stock28/data/
          git diff --quiet && git diff --staged --quiet || \
            git commit -m "chore: 更新二八数据 $(date +'%Y-%m-%d')"
          git push
